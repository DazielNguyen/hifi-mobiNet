name: Publish listening page
on:
  push:
    branches: [main]
    paths:
      - 'demo/listen/**'
      - '.github/workflows/listening-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: listening-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/listen
      - id: deployment
        uses: actions/deploy-pages@v4
