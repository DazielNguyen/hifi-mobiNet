# Piper_no_VITS2_cpn with upstream Piper's own training-harness behaviour
# instead of the baseline-matched harness: no gradient clipping, fixed-order
# (unshuffled) batches, no non-finite update skip, no health gate.
#
# Batch size 22 is the published Piper lj-medium checkpoint's value
# (configs/piper-original.json source). Data and split still come from this
# project (no VAD trimming, banhmi_phonemize IDs, explicit split file), so this
# is NOT a reproduction of the published Piper training run.
model_id: Piper_no_VITS2_cpn

model:
  inter_channels: 192
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0.1
  resblock: "2"
  resblock_kernel_sizes: [3, 5, 7]
  resblock_dilation_sizes: [[1, 2], [2, 6], [3, 12]]
  upsample_rates: [8, 8, 4]
  upsample_initial_channel: 256
  upsample_kernel_sizes: [16, 16, 8]
  filter_length: 1024
  hop_length: 256
  win_length: 1024
  mel_channels: 80
  sample_rate: 22050
  mel_fmin: 0.0
  mel_fmax: null
  segment_size: 8192
  use_spectral_norm: false
  use_sdp: true

optim:
  learning_rate: 0.0002
  betas: [0.8, 0.99]
  eps: 1.0e-9
  lr_decay: 0.999875
  c_mel: 45
  c_kl: 1.0

trainer:
  precision: "32"
  gradient_clip_val: null
  seed: 1234

data:
  batch_size: 22
  sampler: upstream_sequential
  num_workers: 1
  max_phoneme_ids: null
  num_audio_samples: 5

harness:
  skip_nonfinite_updates: false
  dp_health_gate: false
  save_rng_state: true
