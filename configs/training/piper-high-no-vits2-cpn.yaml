# Config A with the High decoder overrides in vendor/piper/__main__.py.
# MPD only: no MRD, Snake, IR bundle, VITS2, BigVGAN or F0.
# Batch 16/GPU matches Medium; VRAM feasibility requires an approved run.
model_id: Piper_High_no_VITS2_cpn

model:
  inter_channels: 192
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0.1
  resblock: "1"
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  upsample_rates: [8, 8, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [16, 16, 4, 4]
  filter_length: 1024
  hop_length: 256
  win_length: 1024
  mel_channels: 80
  sample_rate: 22050
  mel_fmin: 0.0
  mel_fmax: null
  segment_size: 8192
  use_spectral_norm: false
  use_sdp: true
  use_bigvgan: false
  use_vits2: false
  use_f0: false

optim:
  learning_rate: 0.0002
  betas: [0.8, 0.99]
  eps: 1.0e-9
  lr_decay: 0.999875
  c_mel: 45
  c_kl: 1.0
  grad_clip: null

trainer:
  precision: bf16
  gradient_clip_val: null
  seed: 1234

data:
  batch_size: 16
  sampler: length_bucket
  num_workers: 1
  max_phoneme_ids: null
  num_audio_samples: 5

harness:
  skip_nonfinite_updates: false
  dp_health_gate: false
  save_rng_state: true
